<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1131" width="1600" height="1131">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Fondo blanco con barras verticales de color -->
  <rect width="1600" height="1131" fill="#ffffff"/>
  <rect x="0" y="0" width="24" height="1131" fill="url(#bar)"/>
  <rect x="1576" y="0" width="24" height="1131" fill="url(#bar)"/>

  <!-- Sello moderno en esquina superior derecha -->
  <circle cx="1400" cy="180" r="70" fill="none" stroke="#6366f1" stroke-width="3"/>
  <text x="1400" y="175" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#6366f1" letter-spacing="2">OFICIAL</text>
  <text x="1400" y="200" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#6366f1">2026</text>

  <!-- Texto -->
  <text x="160" y="260" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="6" fill="#6366f1">CERTIFICADO</text>
  <text x="160" y="340" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="800" fill="#111827">de Finalización</text>
  <text x="160" y="440" font-family="Inter, Arial, sans-serif" font-size="20" fill="#6b7280">Este certificado se concede con reconocimiento a</text>

  <!-- Línea bajo el nombre -->
  <line x1="160" y1="620" x2="1440" y2="620" stroke="#e5e7eb" stroke-width="2"/>

  <text x="160" y="700" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6b7280">por su dedicación y compromiso durante toda la formación.</text>

  <!-- Firmas -->
  <g font-family="Inter, Arial, sans-serif">
    <line x1="160" y1="960" x2="480" y2="960" stroke="#111827" stroke-width="1"/>
    <text x="160" y="995" font-size="16" font-weight="600" fill="#111827">Dirección Académica</text>
    <line x1="1120" y1="960" x2="1440" y2="960" stroke="#111827" stroke-width="1"/>
    <text x="1120" y="995" font-size="16" font-weight="600" fill="#111827">Fecha de emisión</text>
  </g>
</svg>
